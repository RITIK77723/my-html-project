<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday MUSKAN!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Overlay to force user interaction for audio autoplay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Stay on top of the iframe */
            cursor: pointer;
            transition: opacity 1s ease;
        }

        #start-overlay h1 {
            font-size: 3rem;
            color: #FF1493;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.8);
            animation: pulse 1.5s infinite;
            text-align: center;
            padding: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="start-overlay">
        <h1>Click to open your surprise! ✨</h1>
    </div>

    <!-- The audio file plays in this wrapper so it never stops during iframe navigation -->
    <audio id="bg-music" src="bairan.mp3" loop preload="auto"></audio>
    <iframe src="start.html" id="content-frame" title="Main Content"></iframe>

    <script>
        const overlay = document.getElementById('start-overlay');
        const audio = document.getElementById('bg-music');
        audio.volume = 1.0;
        
        // Remove the overlay and start the music when clicked
        overlay.addEventListener('click', function() {
            audio.play().catch(e => console.log('Audio playback prevented:', e));
            
            // Fade out the overlay smoothly
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1000); // 1 second matches the CSS transition
        });
    </script>
</body>
</html>
